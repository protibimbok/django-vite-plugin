{% load vite %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stderr example — it works</title>

    {% vite %}
    {% vite 'home/js/main.js' %}
</head>
<body>
    <main style="max-width: 36rem; margin: 4rem auto; font-family: system-ui, sans-serif;">

            <code>home/checks.py</code>).

        <p id="proof" style="font-weight: 600;"></p>
    </main>

</html>

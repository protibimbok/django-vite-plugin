{% load vite %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django + Vite + Svelte</title>

    {# Vite client — enables HMR in dev mode #}
    {% vite %}
    {# STATIC_LOOKUP is off: this is the path exactly as Vite sees it, #}
    {# relative to the frontend/ directory. #}
    {% vite 'src/main.ts' %}
</head>
<body>
    <div id="app"></div>
</body>
</html>

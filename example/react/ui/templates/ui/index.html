{% load vite %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django + Vite + React</title>

    {# Vite client — enables HMR in dev mode #}
    {% vite %}
    {# 'react' injects the Fast Refresh preamble in dev mode (nothing in a #}
    {# build). It must come before the entry that renders React. #}
    {% vite 'react' 'ui/js/main.tsx' %}
</head>
<body>
    <div id="root"></div>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django_vite_plugin"
version = "5.0.0"
authors = [
  { name="Sakibur Rahman Khan", email="sakib.saad.khan@gmail.com" },
]
description = "Vite build tools integration for django"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "Django>=4.2",
    "pytest>=7",
]

[project.urls]
"Homepage" = "https://github.com/protibimbok/django-vite-plugin"
"Bug Tracker" = "https://github.com/protibimbok/django-vite-plugin/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/django_vite_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
